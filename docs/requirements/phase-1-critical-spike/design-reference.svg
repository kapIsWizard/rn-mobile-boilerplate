<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1640" viewBox="0 0 1660 1640" role="img" aria-labelledby="title description">
  <title id="title">Private notes visual reference for iOS and Android</title>
  <desc id="description">Approved light-mode reference showing default, loading, error, and populated states on both platforms.</desc>
  <defs>
    <style>
      .sheet { fill: #e8edf5; }
      .frame { fill: #f4f6fa; stroke: #14213d; stroke-width: 4; }
      .surface { fill: #ffffff; }
      .ink { fill: #14213d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #334155; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; }
      .row-label { fill: #14213d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; }
      .title { font-size: 38px; font-weight: 750; }
      .android-title { font-size: 25px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; }
      .button { fill: #2f6fed; }
      .button-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .danger-surface { fill: #fef3f2; stroke: #fecdca; stroke-width: 2; }
      .danger { fill: #b42318; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .skeleton { fill: #dce3ed; }
      .divider { stroke: #e2e8f0; stroke-width: 2; }
    </style>
  </defs>

  <rect class="sheet" width="1660" height="1640" rx="32"/>
  <text class="row-label" x="50" y="50">iOS · light · pl-PL</text>

  <g id="ios-default" transform="translate(50 100)">
    <text class="label" x="180" y="-20" text-anchor="middle">Default</text>
    <rect class="frame" width="360" height="700" rx="48"/>
    <text class="ink small" x="28" y="40">9:41</text>
    <text class="ink title" x="24" y="112">Notatki</text>
    <rect class="surface" x="18" y="142" width="324" height="400" rx="18"/>
    <circle cx="180" cy="270" r="42" fill="#e7efff"/>
    <path d="M165 270h30M180 255v30" stroke="#2f6fed" stroke-width="6" stroke-linecap="round"/>
    <text class="ink body" x="180" y="345" font-weight="700" text-anchor="middle">Nie masz jeszcze notatek</text>
    <text class="muted small" x="180" y="378" text-anchor="middle">Utwórz pierwszą prywatną notatkę.</text>
    <rect class="button" x="24" y="616" width="312" height="56" rx="18"/>
    <text class="button-text" x="180" y="651">Nowa notatka</text>
  </g>

  <g id="ios-loading" transform="translate(450 100)">
    <text class="label" x="180" y="-20" text-anchor="middle">Loading</text>
    <rect class="frame" width="360" height="700" rx="48"/>
    <text class="ink small" x="28" y="40">9:41</text>
    <text class="ink title" x="24" y="112">Notatki</text>
    <rect class="surface" x="18" y="142" width="324" height="126" rx="18"/>
    <rect class="skeleton" x="38" y="170" width="190" height="20" rx="10"/>
    <rect class="skeleton" x="38" y="208" width="268" height="14" rx="7"/>
    <rect class="skeleton" x="38" y="234" width="214" height="14" rx="7"/>
    <rect class="surface" x="18" y="286" width="324" height="126" rx="18"/>
    <rect class="skeleton" x="38" y="314" width="164" height="20" rx="10"/>
    <rect class="skeleton" x="38" y="352" width="252" height="14" rx="7"/>
    <text class="muted small" x="180" y="470" text-anchor="middle">Ładowanie notatek…</text>
  </g>

  <g id="ios-error" transform="translate(850 100)">
    <text class="label" x="180" y="-20" text-anchor="middle">Error</text>
    <rect class="frame" width="360" height="700" rx="48"/>
    <text class="ink small" x="28" y="40">9:41</text>
    <text class="ink title" x="24" y="112">Notatki</text>
    <rect class="danger-surface" x="18" y="142" width="324" height="188" rx="18"/>
    <circle cx="58" cy="184" r="20" fill="#fee4e2"/>
    <text class="danger" x="58" y="192" font-size="24" font-weight="800" text-anchor="middle">!</text>
    <text class="danger body" x="90" y="186" font-weight="700">Nie udało się połączyć</text>
    <text class="muted small" x="38" y="228">Sprawdź internet. Twoje dane</text>
    <text class="muted small" x="38" y="252">pozostały bez zmian.</text>
    <rect x="38" y="274" width="132" height="38" rx="12" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
    <text class="danger small" x="104" y="299" font-weight="700" text-anchor="middle">Spróbuj ponownie</text>
  </g>

  <g id="ios-populated" transform="translate(1250 100)">
    <text class="label" x="180" y="-20" text-anchor="middle">Populated</text>
    <rect class="frame" width="360" height="700" rx="48"/>
    <text class="ink small" x="28" y="40">9:41</text>
    <text class="ink title" x="24" y="112">Notatki</text>
    <rect class="surface" x="18" y="142" width="324" height="150" rx="18"/>
    <text class="ink body" x="38" y="184" font-weight="700">Plan na jutro</text>
    <text class="muted small" x="38" y="218">Sprawdzić wersję natywną</text>
    <line class="divider" x1="38" y1="246" x2="322" y2="246"/>
    <text class="muted small" x="38" y="274">Dzisiaj, 9:41</text>
    <rect class="button" x="24" y="616" width="312" height="56" rx="18"/>
    <text class="button-text" x="180" y="651">Nowa notatka</text>
  </g>

  <text class="row-label" x="50" y="840">Android · light · pl-PL</text>

  <g id="android-default" transform="translate(50 890)">
    <text class="label" x="180" y="-20" text-anchor="middle">Default</text>
    <rect class="frame" width="360" height="700" rx="30"/>
    <rect class="surface" x="2" y="2" width="356" height="104" rx="28"/>
    <text class="ink small" x="24" y="34">9:41</text>
    <text class="ink android-title" x="24" y="78">Notatki</text>
    <circle cx="180" cy="270" r="42" fill="#e7efff"/>
    <path d="M165 270h30M180 255v30" stroke="#2f6fed" stroke-width="6" stroke-linecap="round"/>
    <text class="ink body" x="180" y="345" font-weight="700" text-anchor="middle">Brak notatek</text>
    <text class="muted small" x="180" y="378" text-anchor="middle">Dodaj pierwszą prywatną notatkę.</text>
    <rect class="button" x="166" y="618" width="170" height="56" rx="16"/>
    <text class="button-text" x="251" y="653">+  Nowa notatka</text>
  </g>

  <g id="android-loading" transform="translate(450 890)">
    <text class="label" x="180" y="-20" text-anchor="middle">Loading</text>
    <rect class="frame" width="360" height="700" rx="30"/>
    <rect class="surface" x="2" y="2" width="356" height="104" rx="28"/>
    <text class="ink small" x="24" y="34">9:41</text>
    <text class="ink android-title" x="24" y="78">Notatki</text>
    <rect class="surface" x="18" y="130" width="324" height="126" rx="12"/>
    <rect class="skeleton" x="38" y="158" width="190" height="20" rx="10"/>
    <rect class="skeleton" x="38" y="196" width="268" height="14" rx="7"/>
    <rect class="skeleton" x="38" y="222" width="214" height="14" rx="7"/>
    <rect class="surface" x="18" y="274" width="324" height="126" rx="12"/>
    <rect class="skeleton" x="38" y="302" width="164" height="20" rx="10"/>
    <rect class="skeleton" x="38" y="340" width="252" height="14" rx="7"/>
    <text class="muted small" x="180" y="458" text-anchor="middle">Ładowanie notatek…</text>
  </g>

  <g id="android-error" transform="translate(850 890)">
    <text class="label" x="180" y="-20" text-anchor="middle">Error</text>
    <rect class="frame" width="360" height="700" rx="30"/>
    <rect class="surface" x="2" y="2" width="356" height="104" rx="28"/>
    <text class="ink small" x="24" y="34">9:41</text>
    <text class="ink android-title" x="24" y="78">Notatki</text>
    <rect class="danger-surface" x="18" y="130" width="324" height="188" rx="12"/>
    <text class="danger body" x="38" y="174" font-weight="700">Brak połączenia</text>
    <text class="muted small" x="38" y="210">Sprawdź internet. Twoje dane</text>
    <text class="muted small" x="38" y="234">pozostały bez zmian.</text>
    <rect x="38" y="258" width="132" height="42" rx="10" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
    <text class="danger small" x="104" y="285" font-weight="700" text-anchor="middle">Spróbuj ponownie</text>
  </g>

  <g id="android-populated" transform="translate(1250 890)">
    <text class="label" x="180" y="-20" text-anchor="middle">Populated</text>
    <rect class="frame" width="360" height="700" rx="30"/>
    <rect class="surface" x="2" y="2" width="356" height="104" rx="28"/>
    <text class="ink small" x="24" y="34">9:41</text>
    <text class="ink android-title" x="24" y="78">Notatki</text>
    <rect class="surface" x="18" y="130" width="324" height="150" rx="12"/>
    <text class="ink body" x="38" y="172" font-weight="700">Plan na jutro</text>
    <text class="muted small" x="38" y="206">Sprawdzić wersję natywną</text>
    <line class="divider" x1="38" y1="234" x2="322" y2="234"/>
    <text class="muted small" x="38" y="262">Dzisiaj, 9:41</text>
    <rect class="button" x="166" y="618" width="170" height="56" rx="16"/>
    <text class="button-text" x="251" y="653">+  Nowa notatka</text>
  </g>
</svg>
